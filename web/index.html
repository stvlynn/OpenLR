<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenLR</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="organization.css"></head><body>
<header><strong>OpenLR</strong><button id="import">＋ Add photos</button><input id="files" type="file" multiple accept="image/*" hidden><input id="search" type="search" placeholder="Search photos" aria-label="Search photos"><button id="export" disabled>Export</button></header>
<main><nav><button data-scope="all">All photos</button><button data-scope="picked">Flagged</button><button data-scope="trash">Deleted</button><section><h2>Albums <button id="new-album" aria-label="Create album">＋</button></h2><div id="albums"></div></section></nav>
<article><div class="bar"><h1 id="heading">All photos</h1><span id="count"></span><select id="order" aria-label="Sort photos"><option value="recent">Recently added</option><option value="name">File name</option><option value="rating">Star rating</option></select><button id="grid">Grid</button><button id="detail" disabled>Edit</button></div>
<div id="gallery"></div><div id="stage" hidden></div><div id="film" hidden></div></article>
<aside hidden><h2>Edit <button id="auto-tone">Auto</button></h2><details id="histogram-panel"><summary>Histogram</summary><canvas aria-label="RGB histogram" id="histogram" width="256" height="76"></canvas></details><div id="adjustments"></div><details><summary>Crop &amp; rotate</summary><button id="crop-tool">Crop area</button><button id="clear-crop">Clear crop</button><label>Aspect <select id="aspect"><option value="">Original</option><option value="1">1 × 1</option><option value="1.5">3 × 2</option><option value="1.7777777778">16 × 9</option><option value="0.8">4 × 5</option></select></label><button id="left">Rotate left</button><button id="right">Rotate right</button><button id="flip">Flip horizontal</button></details>
<button id="reset">Reset edits</button><button id="compare">Show original</button><details><summary>Info</summary><div id="info"></div><label>Keywords <input id="keywords"></label></details></aside></main>
<footer><span id="filename"></span><div id="actions" hidden><select id="rate" aria-label="Star rating"><option value="0">Unrated</option></select><select id="flag" aria-label="Flag"><option value="">Unflagged</option><option value="pick">Picked</option><option value="reject">Rejected</option></select><select id="membership" aria-label="Add to album"></select><button id="delete">Delete</button></div></footer>
<dialog id="album-dialog"><form method="dialog"><h2>Create album</h2><input id="album-name" placeholder="Album name" required><div><button formnovalidate value="cancel">Cancel</button><button value="ok">Create</button></div></form></dialog>
<dialog id="export-dialog"><form method="dialog"><h2>Export photo</h2><label>File type <select id="format"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="original">Original</option></select></label><label>JPEG quality <input type="range" min="1" max="100" value="92" id="quality"></label><div><button value="cancel">Cancel</button><button value="ok">Save</button></div></form></dialog>
<output id="notice" role="status"></output><script type="module" src="app.js"></script><script type="module" src="agent.js"></script></body></html>
