<!doctype html>
<meta charset="utf-8" />
<script>
  ;(async () => {
    let status
    try {
      status = (
        await fetch('mygo://localhost/__openlr_bridge', {
          method: 'POST',
          body: JSON.stringify({ document: 'forged', kind: 'message', message: 'forged' })
        })
      ).status
    } catch {
      status = 'fetch-error'
    }
    parent.postMessage({ schemeChild: true, bridgeAbsent: typeof window.mygo === 'undefined', status }, '*')
  })()
</script>
