name: macOS first seek observation
on:
  workflow_dispatch:
  push:
    branches: [experiment/macos-first-seek]
    paths:
      - .github/workflows/macos-video-release-reliability.yml
permissions:
  contents: read
jobs:
  release-video:
    strategy:
      fail-fast: false
      matrix:
        diagnostics: ['off', 'on']
    runs-on: macos-15
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
      FIRST_SEEK_DIAGNOSTICS: ${{ matrix.diagnostics }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - name: Verify native lifecycle outcome checks
        run: node --test tests/native-workspace.test.js tests/native-startup-diagnostics.test.js
      - name: Build the ordinary vendored release
        run: |
          node scripts/desktop.mjs build -o build/release -platform darwin/arm64
          go version -m build/release/darwin-arm64/OpenLR.app/Contents/MacOS/OpenLR > build/release/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: first-seek-package-${{ matrix.diagnostics }}
          path: build/release/darwin-arm64/*.dmg
          if-no-files-found: error
      - name: Provision the fixed independent video oracle
        run: |
          mkdir -p build/video-oracle
          curl --fail --location "https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.38/mac-arm64/chrome-mac-arm64.zip" -o build/video-oracle/chrome.zip
          ditto -xk build/video-oracle/chrome.zip build/video-oracle
          echo "OPENLR_VIDEO_PROBE_CHROME=$PWD/build/video-oracle/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" >> "$GITHUB_ENV"
      - name: Observe twenty-four release workspaces with the retained source
        timeout-minutes: 28
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { copyFile, mkdir, readFile, writeFile } from 'node:fs/promises'
          import { runVideoTrials } from './scripts/native-video-trials.mjs'
          const destination = 'build/release-video-trials'
          const diagnosticsMode = process.env.FIRST_SEEK_DIAGNOSTICS
          assert.ok(['off', 'on'].includes(diagnosticsMode), 'Expected diagnostics off or on')
          const diagnostics = diagnosticsMode === 'on'
          const source = 'scripts/fixtures/macos-first-seek/fixture.webm'
          const bytes = await readFile(source)
          await mkdir(destination, { recursive: true })
          await writeFile(destination + '/fixture.webm', bytes, { flag: 'wx' })
          assert.deepEqual(await readFile(destination + '/fixture.webm'), bytes)
          await copyFile('scripts/fixtures/macos-first-seek/README.md', destination + '/fixture-provenance.md')
          await writeFile(destination + '/observation.json', JSON.stringify({
            sourceRun: '42392485539', sourceRevision: 'df741d6',
            sourceArtifact: 'release-video-evidence', sourcePath: 'release-video-trials/fixture.webm',
            bytes: bytes.length, applicationBaseline: 'df741d6', applicationRevision: process.env.GITHUB_SHA,
            diagnosticsMode, diagnostics, audioDiagnostics: false,
            scope: 'Fixed 24 fresh hosts; same retained generated bytes, stock toolchain and bounded failure-only error details. No application pre-trim read, inserted wait, fault injection, debugger or custom SDK.'
          }, null, 2))
          await runVideoTrials({
            apps: { release: 'build/release/darwin-arm64/OpenLR.app/Contents/MacOS/OpenLR' },
            order: Array(24).fill('release'),
            environments: { release: { OPENLR_DIAGNOSTICS: diagnostics ? '1' : '0', OPENLR_AUDIO_DIAGNOSTICS: '0' } },
            destination
          })
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-seek-evidence-${{ matrix.diagnostics }}
          path: |
            build/release/build-info.txt
            build/release-video-trials
