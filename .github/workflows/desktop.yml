name: Desktop verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - if: runner.os == 'Windows'
        run: npm test
      - name: Build the native distribution
        run: node scripts/desktop.mjs build -o build/release -platform ${{ runner.os == 'Windows' && 'windows/amd64' || runner.os == 'macOS' && 'darwin/universal' || 'linux/amd64' }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node scripts/native-suite.mjs build/release/linux-amd64/openlr
      - if: runner.os == 'macOS'
        run: node scripts/native-suite.mjs build/release/darwin-universal/OpenLR.app/Contents/MacOS/OpenLR
      - if: runner.os == 'Windows'
        run: node scripts/native-suite.mjs build/release/windows-amd64/OpenLR.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLR-${{ runner.os }}
          path: |
            build/release/*/*.deb
            build/release/*/*.tar.gz
            build/release/*/*.dmg
            build/release/*/openlr-setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ runner.os }}
          path: |
            .workspace/native-final/*report.json
            .workspace/native-final/workspace.png
          if-no-files-found: ignore

