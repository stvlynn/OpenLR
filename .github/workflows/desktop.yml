name: Debian cold document delivery
on: workflow_dispatch
permissions:
  contents: read
jobs:
  installed-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 496e001fa25f474009dcba88b2a7fd59637f6076
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - name: Build the Debian package
        run: node scripts/desktop.mjs build -o build/release -platform linux/amd64
      - name: Install and verify the Debian package
        run: bash scripts/native-deb-smoke.sh build/release/linux-amd64/openlr_*.deb
