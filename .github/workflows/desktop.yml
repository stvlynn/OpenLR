name: Desktop verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'Windows'
        run: npm test
      - run: go build -o build/smoke${{ runner.os == 'Windows' && '.exe' || '' }} .
      - if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node scripts/native-smoke.mjs build/smoke
      - if: runner.os == 'macOS'
        run: node scripts/native-smoke.mjs build/smoke
      - if: runner.os == 'Windows'
        run: node scripts/native-smoke.mjs build/smoke.exe

