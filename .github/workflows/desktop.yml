name: Desktop verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 gstreamer1.0-plugins-bad xvfb
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - if: runner.os == 'Windows'
        run: npm test
      - name: Build the native distribution
        id: distribution
        run: node scripts/desktop.mjs build -o build/release -platform ${{ runner.os == 'Windows' && 'windows/amd64' || runner.os == 'macOS' && 'darwin/universal' || 'linux/amd64' }}
      - name: Mount, copy and verify the macOS disk image
        timeout-minutes: 5
        run: bash scripts/native-dmg-smoke.sh build/release/darwin-universal/openlr-*.dmg
