name: Desktop verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-0 gstreamer1.0-plugins-bad xvfb
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - name: Build the native distribution
        id: distribution
        run: node scripts/desktop.mjs build -o build/release -platform ${{ runner.os == 'Windows' && 'windows/amd64' || runner.os == 'macOS' && 'darwin/universal' || 'linux/amd64' }}
      - name: Install, exercise the packaged CLI and uninstall
        timeout-minutes: 5
        run: |
          $installers = @(Get-ChildItem -LiteralPath build/release/windows-amd64 -Filter 'openlr-setup-*.exe')
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer' }
          ./scripts/native-installer-smoke.ps1 -Installer $installers[0].FullName
