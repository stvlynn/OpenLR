name: Apple Photos export experiment
on: workflow_dispatch
permissions:
  contents: read
jobs:
  photos-export:
    strategy:
      fail-fast: false
      matrix:
        launch: [option-key, argument-domain, string-preference]
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Inspect Photos on a fresh runner
        shell: bash
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          if pgrep -x Photos >/dev/null; then
            echo 'Photos was running before the experiment'
            exit 1
          fi
          if find "$HOME/Pictures" -maxdepth 1 -name '*.photoslibrary' 2>/dev/null | grep -q .; then
            echo 'The runner image already has a default Photos library'
          fi
          sw_vers
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' /System/Applications/Photos.app/Contents/Info.plist
          export PHOTOS_PROBE="$(mktemp -d "$RUNNER_TEMP/openlr-photos.XXXXXX")"
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          import path from 'node:path'
          import { makePng } from './tests/fixtures/png.mjs'
          const width = 32, height = 24
          await writeFile(path.join(process.env.PHOTOS_PROBE, 'Generated.png'), makePng({
            width, height, bits: 8, data: Array.from({ length: width * height }, () => [64, 96, 128]).flat()
          }))
          NODE
          osacompile -o "$PHOTOS_PROBE/inspect.scpt" scripts/fixtures/photos-inspect.applescript
          case '${{ matrix.launch }}' in
            option-key)
              osascript <<'APPLESCRIPT'
          tell application "System Events" to key down option
          try
              do shell script "/usr/bin/open -b com.apple.Photos"
              delay 2.0
          on error errorText number errorNumber
              tell application "System Events" to key up option
              error errorText number errorNumber
          end try
          tell application "System Events" to key up option
          APPLESCRIPT
              ;;
            argument-domain)
              open -b com.apple.Photos --args -IPXDefaultShowLibraryChooserOnLaunch true
              ;;
            string-preference)
              defaults write com.apple.Photos IPXDefaultShowLibraryChooserOnLaunch -string true
              open -b com.apple.Photos
              ;;
          esac
          osascript "$PHOTOS_PROBE/inspect.scpt"
