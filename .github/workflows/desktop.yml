name: Desktop verification
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - if: runner.os == 'Windows'
        run: npm test
      - run: go build -o build/smoke${{ runner.os == 'Windows' && '.exe' || '' }} .
      - if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- node scripts/native-suite.mjs build/smoke
      - if: runner.os == 'macOS'
        run: node scripts/native-suite.mjs build/smoke
      - if: runner.os == 'Windows'
        run: node scripts/native-suite.mjs build/smoke.exe
      - uses: actions/upload-artifact@v4
        with:
          name: verification-${{ runner.os }}
          path: |
            .workspace/native-final/*report.json
            .workspace/native-final/workspace.png
          if-no-files-found: ignore

