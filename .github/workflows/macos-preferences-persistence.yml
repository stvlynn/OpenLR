name: macOS preferences persistence probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  persistence:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build the isolated MyGo fixture
        env:
          CGO_ENABLED: '0'
        run: go build -tags mygo_noinspector -ldflags '-X github.com/egoist/mygo.production=1' -o build/preferences-probe ./scripts/fixtures/preferences-probe
      - name: Compare acknowledged writes across immediate normal quits
        run: node scripts/native-preferences-probe.mjs build/preferences-probe build/preferences-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preferences-${{ matrix.os }}
          path: build/preferences-report.json
