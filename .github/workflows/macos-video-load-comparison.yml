name: Apple Silicon still-image crash comparison
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Native behavior to observe
        type: choice
        options: [still-trace]
        default: still-trace
permissions:
  contents: read
jobs:
  still-trace:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: 8a76636467041ea8720d20756dd754fc01f67e7c
          path: production
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: production/go.mod
      - name: Build the unmodified production package
        working-directory: production
        run: |
          npm ci
          node scripts/desktop.mjs build -o build/release -platform darwin/universal
      - name: Run both observation conditions in a fixed schedule
        working-directory: production
        run: node ../scripts/native-still-crash-comparison.mjs build/release/darwin-universal/OpenLR.app/Contents/MacOS/OpenLR "$GITHUB_WORKSPACE/build/still-trace"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: still-trace-macos-15
          path: build/still-trace
