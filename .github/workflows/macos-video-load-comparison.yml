name: macOS Launch Services file-open check
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Native integration to verify
        type: choice
        options: [file-open]
        default: file-open
permissions:
  contents: read
jobs:
  file-open:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ca71e855d088b1829734acb2e1e485ab9210bdb6
          path: production
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: production/go.mod
      - name: Build the unmodified application
        working-directory: production
        run: |
          npm ci
          node scripts/desktop.mjs build -o build/release -platform darwin/universal
      - name: Copy the DMG app and deliver files through Launch Services
        working-directory: production
        shell: bash
        run: |
          cp ../scripts/native-file-open-smoke.mjs scripts/native-file-open-smoke.mjs
          cp ../scripts/native-dmg-smoke.sh scripts/native-dmg-smoke.sh
          bash scripts/native-dmg-smoke.sh build/release/darwin-universal/openlr-*.dmg
