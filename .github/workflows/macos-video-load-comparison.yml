name: Apple Silicon production VP9 seek verification
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Media workflow
        type: choice
        options: [seek]
        default: seek
permissions:
  actions: read
  contents: read
jobs:
  seek:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Retrieve the production revision
        uses: actions/checkout@v5
        with:
          ref: 77412e50525b2a4bd5199248c15885a32372372c
          path: production
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: production/go.mod
      - name: Build the unmodified production app
        working-directory: production
        run: |
          npm ci
          node scripts/desktop.mjs build -o build/video-poster -platform darwin/universal
      - name: Provision independent fixture tools
        run: command -v ffmpeg && command -v ffprobe || brew install ffmpeg
      - name: Retrieve the exact previous media samples
        uses: actions/download-artifact@v4
        with:
          name: video-vp9-handoff-macos-15
          path: build/prior-poster-formats
          run-id: 42291957159
          github-token: ${{ github.token }}
      - name: Verify production handoffs and repeat failed seeks
        shell: bash
        run: |
          mkdir -p build/video-poster-trials
          cp build/prior-poster-formats/{vp9,vp9-709,vp9-remux,vp9-remux-709}.webm build/video-poster-trials/
          node scripts/native-video-poster-formats.mjs \
            production/build/video-poster/darwin-universal/OpenLR.app/Contents/MacOS/OpenLR \
            build/video-poster-trials 2>&1 | tee build/video-poster-trials/workflow.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-vp9-production-macos-15
          path: build/video-poster-trials
