name: macOS packaged video load comparison
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Video behavior to compare
        type: choice
        options: [load, pause, decoder, poster]
        default: load
permissions:
  contents: read
jobs:
  comparison:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VIDEO_COMPARISON: ${{ inputs.comparison || 'load' }}
      VIDEO_CONTROL: ${{ inputs.comparison == 'poster' && 'native-poster' || inputs.comparison == 'decoder' && 'default-decoder' || inputs.comparison == 'pause' && 'frame-first' || 'automatic' }}
      VIDEO_CANDIDATE: ${{ inputs.comparison == 'poster' && 'decoded-poster' || inputs.comparison == 'decoder' && 'software-decoder' || inputs.comparison == 'pause' && 'anchor-first' || 'explicit' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: npm ci
      - name: Provision independent fixture tools
        run: command -v ffmpeg && command -v ffprobe || brew install ffmpeg
      - name: Build the comparison control
        run: node scripts/desktop.mjs build -o "build/video-$VIDEO_CONTROL" -platform darwin/universal
      - name: Build the comparison candidate
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          comparison = os.environ['VIDEO_COMPARISON']
          source = Path('web/video-frames.js' if comparison == 'decoder' else 'web/video.js')
          edits = []
          if comparison == 'decoder':
              marker = b'new CanvasSink(track, { alpha: true })'
              replacement = b"new CanvasSink(track, { alpha: true, decoderOptions: { hardwareAcceleration: 'prefer-software' } })"
          elif comparison == 'pause':
              frame = (
                  b"          markVideoSeek(trace, 'pause-frame', video)\n"
                  b'          const image = await frameAt(time)\n'
                  b"          markVideoSeek(trace, 'pause-frame-read', video)\n"
              )
              anchor = (
                  b'          // Anchor a paused clock before it can fall back to the previous seek.\n'
                  b'          if (!closed && isCurrent() && video.paused) await seek(time, true, trace)\n'
              )
              marker, replacement = frame + anchor, anchor + frame
          elif comparison == 'poster':
              marker = b"""export async function poster(file, diagnostic) {
            const media = await openVideo(file, diagnostic)
            try {
              const frame = await media.frameAt()
              markVideoImport(diagnostic, 'poster-bitmap', media.video)
              return { bitmap: await createImageBitmap(frame), duration: media.duration }
            } finally {
              media.close()
            }
          }
          """
              replacement = b"""export async function poster(file, diagnostic) {
            markVideoImport(diagnostic, 'poster-frame-decoder')
            const { decodeVideoFrames } = await import('./video-frames.js')
            const source = await decodeVideoFrames(file)
            try {
              const duration = await source.duration()
              if (!duration) throw Error('No playable video track')
              const frame = await source.at(0)
              markVideoImport(diagnostic, 'poster-bitmap')
              return { bitmap: await createImageBitmap(frame), duration }
            } finally {
              source.close()
            }
          }
          """
              frame = b'      at(time) {\n        const requested = timestamp(time)\n'
              edits.append((Path('web/video-frames.js'), frame, b'      duration: () => input.computeDuration(),\n' + frame))
          else:
              marker = b'\n          video.src = url\n'
              replacement = marker + b'          video.load()\n'
          edits.append((source, marker, replacement))
          originals = {file: file.read_bytes() for file, _, _ in edits}
          for file, before, _ in edits:
              if originals[file].count(before) != 1:
                  raise RuntimeError(f'Expected one comparison source block in {file}')
          try:
              for file, before, after in edits:
                  file.write_bytes(originals[file].replace(before, after))
              output = 'build/video-' + os.environ['VIDEO_CANDIDATE']
              subprocess.run(['node', 'scripts/desktop.mjs', 'build', '-o', output, '-platform', 'darwin/universal'], check=True)
          finally:
              for file, original in originals.items():
                  file.write_bytes(original)
          PY
      - name: Compare actual import, thumbnail and first seek across formats
        run: >-
          node scripts/native-video-poster-formats.mjs
          "build/video-$VIDEO_CONTROL/darwin-universal/OpenLR.app/Contents/MacOS/OpenLR"
          "build/video-$VIDEO_CANDIDATE/darwin-universal/OpenLR.app/Contents/MacOS/OpenLR"
          "build/video-$VIDEO_COMPARISON-trials"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-${{ env.VIDEO_COMPARISON }}-${{ matrix.os }}
          path: build/video-${{ env.VIDEO_COMPARISON }}-trials
