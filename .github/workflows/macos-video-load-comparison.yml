name: Apple Silicon video export postmortem
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Diagnostic workflow
        type: choice
        options: [trace]
        default: trace
permissions:
  contents: read
jobs:
  postmortem:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: 205cd4585084dc6d02471c77d62ad8c6fa6d449e
          path: production
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: production/go.mod
      - name: Provision the pinned fixture browser
        run: |
          mkdir -p build/video-oracle
          curl --fail --location "https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.38/mac-arm64/chrome-mac-arm64.zip" -o build/video-oracle/chrome.zip
          ditto -xk build/video-oracle/chrome.zip build/video-oracle
          echo "OPENLR_VIDEO_PROBE_CHROME=$PWD/build/video-oracle/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" >> "$GITHUB_ENV"
      - name: Build the unmodified production app
        working-directory: production
        run: |
          npm ci
          node scripts/desktop.mjs build -o build/release -platform darwin/universal
      - name: Run the fixed schedule without debugger attachment
        working-directory: production
        run: >-
          node scripts/native-video-export-trials.mjs build/release/darwin-universal/OpenLR.app/Contents/MacOS/OpenLR
          "$GITHUB_WORKSPACE/build/video-postmortem"
      - name: Collect delayed system evidence for the owned failed processes
        if: always()
        run: |
          if test -f build/video-postmortem/report.json; then
            node scripts/native-video-postmortem.mjs build/video-postmortem
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-postmortem-macos-15
          path: build/video-postmortem
