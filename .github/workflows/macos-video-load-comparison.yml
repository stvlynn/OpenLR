name: macOS cold Launch Services file-open check
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Native integration to verify
        type: choice
        options: [cold-file-open]
        default: cold-file-open
permissions:
  contents: read
jobs:
  cold-file-open:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: b8cc778cc5e9c4f44bbfcb7acefd38c30ef3fd45
          path: production
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: production/go.mod
      - name: Build the unmodified application
        working-directory: production
        run: |
          npm ci
          node scripts/desktop.mjs build -o build/release -platform darwin/universal
      - name: Deliver a document to a stopped application through Launch Services
        working-directory: production
        shell: bash
        run: |
          xcrun swiftc -parse-as-library ../scripts/fixtures/cold-document-launch.swift -o build/cold-document-launch
          cp ../scripts/native-workspace.mjs scripts/native-workspace.mjs
          cp ../scripts/native-file-open-smoke.mjs scripts/native-file-open-smoke.mjs
          cp ../scripts/native-dmg-smoke.sh scripts/native-dmg-smoke.sh
          bash scripts/native-dmg-smoke.sh build/release/darwin-universal/openlr-*.dmg build/cold-document-launch
