name: macOS native folder and Save panels
on:
  workflow_dispatch:
    inputs:
      comparison:
        description: Native interaction to verify
        type: choice
        options: [dialogs]
        default: dialogs
permissions:
  contents: read
jobs:
  native-dialogs:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Compile the System Events driver
        run: osacompile -o "$RUNNER_TEMP/OpenLRNativeDialog.scpt" scripts/drive-native-dialog.applescript
      - uses: actions/checkout@v5
        with:
          ref: 8a76636467041ea8720d20756dd754fc01f67e7c
          path: production
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        with:
          go-version-file: production/go.mod
      - name: Build the unmodified production package
        working-directory: production
        run: |
          npm ci
          node scripts/desktop.mjs build -o build/release -platform darwin/universal
      - name: Exercise the real AppKit panels through System Events
        working-directory: production
        shell: bash
        run: |
          cp ../scripts/native-dialog-smoke.mjs scripts/native-dialog-smoke.mjs
          cp ../scripts/drive-native-dialog.applescript scripts/drive-native-dialog.applescript
          node scripts/native-dialog-smoke.mjs build/release/darwin-universal/OpenLR.app/Contents/MacOS/OpenLR
