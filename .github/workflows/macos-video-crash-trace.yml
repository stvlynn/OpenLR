name: macOS original signal calibration
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Symbolicate a completed signal-context observation run
        type: string
        default: ''
      trace_workflow:
        description: Attach the existing owned-host debugger before importing the fixture
        type: boolean
        default: false
      frida_calibration:
        description: Calibrate REA exception observation without starting application trials
        type: boolean
        default: false
      frida_stage:
        description: Select exception calibration or independent binding startup diagnosis
        type: choice
        options:
          - exception
          - startup
        default: exception
      post_signal_calibration:
        description: Calibrate stopped original-context capture without application trials
        type: boolean
        default: false
      post_signal_workflow:
        description: Capture the original stack only after a native application fault
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  signal-context:
    if: inputs.source_run == ''
    runs-on: macos-15
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-go@v6
        if: ${{ !(inputs.frida_calibration && inputs.frida_stage == 'startup') }}
        with:
          go-version-file: go.mod
      - run: npm ci
      - name: Record the source host system image identities
        run: |
          mkdir -p build/signal-calibration
          {
            uname -a
            sw_vers
            for image in /System/Library/Frameworks/JavaScriptCore.framework/Versions/A/JavaScriptCore /usr/lib/system/libsystem_kernel.dylib; do
              printf '\nImage: %s\n' "$image"
              if xcrun dyld_info -arch arm64e -uuid "$image"; then status=0; else status=$?; fi
              printf 'dyld_info exit status: %s\n' "$status"
            done
          } > build/signal-calibration/source-system-images.log 2>&1
          cat build/signal-calibration/source-system-images.log
      - name: Prepare the isolated signal-observation toolchain
        if: ${{ !(inputs.frida_calibration && inputs.frida_stage == 'startup') }}
        run: |
          node scripts/prepare-signal-runtime.mjs
          echo "GOROOT=$PWD/build/signal-toolchain" >> "$GITHUB_ENV"
      - name: Calibrate foreign-thread breakpoints and raised signals
        if: ${{ !(inputs.frida_calibration && inputs.frida_stage == 'startup') }}
        run: node scripts/calibrate-signal-context.mjs
      - name: Calibrate stopped-thread stack and register capture
        if: ${{ inputs.trace_workflow && !(inputs.frida_calibration && inputs.frida_stage == 'startup') }}
        run: node scripts/calibrate-host-trace.mjs
      - name: Calibrate post-fault capture and original signal continuation
        if: ${{ inputs.post_signal_calibration || inputs.post_signal_workflow }}
        run: node scripts/calibrate-post-signal.mjs
      - name: Provision the pinned REA instrumentation runtime
        if: inputs.frida_calibration
        run: |
          npm install --prefix build/rea-runtime --no-save --package-lock=false --no-audit --no-fund rea-agents@6.8.0
          echo "OPENLR_REA_CLI=$PWD/build/rea-runtime/node_modules/rea-agents/scripts/rea.mjs" >> "$GITHUB_ENV"
          node build/rea-runtime/node_modules/rea-agents/scripts/rea.mjs --version
          node --input-type=module -e 'const f = await import(process.argv[1]); console.log("Frida local-device binding:", typeof f.getLocalDevice)' "$PWD/build/rea-runtime/node_modules/frida/build/src/frida.js"
      - name: Calibrate original exception context through REA
        if: ${{ inputs.frida_calibration && inputs.frida_stage != 'startup' }}
        run: node scripts/calibrate-frida-signal.mjs
      - name: Diagnose isolated binding startup and owned C attachment
        if: ${{ inputs.frida_calibration && inputs.frida_stage == 'startup' }}
        run: node scripts/probe-frida-startup.mjs build/signal-calibration/frida-startup
      - name: Build the diagnostic native application
        if: ${{ !inputs.frida_calibration && !inputs.post_signal_calibration }}
        env:
          POST_SIGNAL_WORKFLOW: ${{ inputs.post_signal_workflow }}
        run: |
          if [ "$POST_SIGNAL_WORKFLOW" = true ]; then
            export MYGO_LDFLAGS="${MYGO_LDFLAGS:+$MYGO_LDFLAGS }-X runtime.openlrFreezeSignal=1"
          fi
          node scripts/desktop.mjs build -o build/release -platform darwin/arm64
          go version -m build/release/darwin-arm64/OpenLR.app/Contents/MacOS/OpenLR > build/signal-calibration/application-build-info.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.frida_calibration && !inputs.post_signal_calibration }}
        with:
          name: original-signal-macos-package
          path: build/release/darwin-arm64/*.dmg
      - name: Provision the fixed fixture browser
        if: ${{ !inputs.frida_calibration && !inputs.post_signal_calibration }}
        run: |
          mkdir -p build/video-oracle
          curl --fail --location "https://storage.googleapis.com/chrome-for-testing-public/157.0.8103.38/mac-arm64/chrome-mac-arm64.zip" -o build/video-oracle/chrome.zip
          ditto -xk build/video-oracle/chrome.zip build/video-oracle
          echo "OPENLR_VIDEO_PROBE_CHROME=$PWD/build/video-oracle/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing" >> "$GITHUB_ENV"
      - name: Observe the fixed twenty-four-trial schedule
        if: ${{ !inputs.frida_calibration && !inputs.post_signal_calibration }}
        timeout-minutes: 28
        env:
          OPENLR_DIAGNOSTICS: '1'
          OPENLR_SIGNAL_RESOURCES: '1'
          TRACE_WORKFLOW: ${{ inputs.trace_workflow }}
          POST_SIGNAL_WORKFLOW: ${{ inputs.post_signal_workflow }}
        run: |
          mode=()
          if [ "$POST_SIGNAL_WORKFLOW" = true ]; then mode=(--post-signal);
          elif [ "$TRACE_WORKFLOW" = true ]; then mode=(--lldb-workflow); fi
          node scripts/native-video-export-trials.mjs build/release/darwin-arm64/OpenLR.app/Contents/MacOS/OpenLR build/video-export-trials "${mode[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-signal-context
          path: |
            build/signal-calibration
            build/video-export-trials
  symbolication:
    if: inputs.source_run != ''
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Read the completed observation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: gh run download "$SOURCE_RUN" --name original-signal-context --dir build/source-observation
      - name: Resolve saved signal addresses
        run: node scripts/symbolicate-signal-trials.mjs build/source-observation build/signal-symbolication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-signal-symbolication
          path: build/signal-symbolication.json
