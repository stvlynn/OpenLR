<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenLR album review</title>
<style>body{background:#151719;color:#eee;font:16px system-ui;margin:0}header,main{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:24px}h1{flex:1}article{background:#22262a;border-radius:12px;margin-bottom:24px;padding:20px}img{display:block;max-width:100%;max-height:75vh;margin:auto}button,input,textarea{font:inherit;background:#30373e;color:white;border:1px solid #65717b;border-radius:5px;padding:9px}form{display:flex;gap:8px;margin:16px 0}textarea{flex:1}small{color:#bec8d0}.comment{white-space:pre-wrap;border-left:2px solid #7d8d99;padding:8px 12px}button{cursor:pointer}</style>
<header><h1>Album review</h1><label>Your name <input id="name" placeholder="Reviewer"></label></header><main id="content">Loading album…</main><footer style="max-width:1100px;margin:auto;padding:24px"><a href="https://github.com/stvlynn/OpenLR" rel="noreferrer" style="color:#bec8d0">OpenLR source · AGPL-3.0-only</a></footer>
<script type="module">
const segments=location.pathname.split('/').filter(Boolean),position=segments.lastIndexOf('albums'),id=segments[position+1],prefix=segments.slice(0,position).join('/'),key=new URLSearchParams(location.search).get('key')||'',base=(prefix?'/'+prefix:'')+'/review/'+encodeURIComponent(id),query='?key='+encodeURIComponent(key),content=document.getElementById('content'),name=document.getElementById('name');
let identity=localStorage.getItem('openlr-reviewer');if(!identity){identity=crypto.randomUUID();localStorage.setItem('openlr-reviewer',identity)}name.value=localStorage.getItem('openlr-reviewer-name')||'';name.onchange=()=>localStorage.setItem('openlr-reviewer-name',name.value);
const api=async(path='',body)=>{const response=await fetch(base+path+query,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,name:name.value,reviewerId:identity})}:{});const data=await response.json();if(!response.ok)throw Error(data.error||'Album unavailable');return data};
async function show(){try{const album=await api();document.querySelector('h1').textContent=album.title;document.title=album.title+' · OpenLR review';content.replaceChildren();for(const photo of album.photos){const card=document.createElement('article'),image=new Image(),title=document.createElement('h2'),count=document.createElement('small');image.src=base+'/photos/'+encodeURIComponent(photo.id)+query;image.alt=photo.name;title.textContent=photo.name;count.textContent=Object.keys(album.likes[photo.id]||{}).length+' likes';card.append(image,title,count);if(album.allowLikes){const like=document.createElement('button');like.textContent=album.likes[photo.id]?.[identity]?'Unlike':'Like';like.onclick=async()=>{try{await api('/likes',{photoId:photo.id,liked:!album.likes[photo.id]?.[identity]});await show()}catch(error){alert(error.message)}};card.append(like)}for(const comment of album.comments.filter(item=>item.photoId===photo.id)){const text=document.createElement('p');text.className='comment';text.textContent=comment.name+': '+comment.text;card.append(text)}if(album.allowComments){const form=document.createElement('form'),text=document.createElement('textarea'),send=document.createElement('button');text.placeholder='Write a comment';text.setAttribute('aria-label','Comment on '+photo.name);text.required=true;send.textContent='Post comment';form.append(text,send);form.onsubmit=async event=>{event.preventDefault();try{await api('/comments',{photoId:photo.id,text:text.value});await show()}catch(error){alert(error.message)}};card.append(form)}content.append(card)}}catch(error){content.textContent=error.message}}
show();
</script></html>
